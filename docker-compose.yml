# docker-compose.yml
services:
  api:
    build:
      context: .
      target: api
    ports:
      - "3001:3001"
    env_file:
      - .env.local
    volumes:
      - ./api:/app/api
      - ./lib:/app/lib
      - ./server:/app/server
      - ./scripts:/app/scripts
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
    ports:
      - "5173:5173"
    env_file:
      - .env.local
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
      - ./tailwind.config.js:/app/tailwind.config.js
      - ./postcss.config.js:/app/postcss.config.js
    depends_on:
      - api
    restart: unless-stopped

  # roda o seed de dados iniciais (1x, não fica em execução contínua)
  # uso: docker compose run --rm seed
  seed:
    build:
      context: .
      target: api
    env_file:
      - .env.local
    volumes:
      - ./scripts:/app/scripts
    command: node /app/scripts/seed.js
    profiles:
      - tools
